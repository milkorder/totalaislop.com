<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOTALaiSLOP</title>
<meta name="description" content="AI news, a little sloppy.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img class="mascot" src="slopstar.jpg?v=2" alt="SlopStar, the TOTALaiSLOP mascot">
  <h1>TOTALaiSLOP</h1>
  <p class="tagline">AI news, a little sloppy. Served fresh-ish, daily.</p>
</header>

<script>
(function(){var t=new Date("2027-04-11T00:00:00-08:00").getTime();
function u(){var d=t-Date.now();if(d<=0){cd.textContent="POP!";document.querySelector(".cdunit").textContent="";document.querySelector(".cdtail").textContent="";cdsub.textContent="";return}
var D=Math.ceil(d/864e5),h=Math.floor(d%864e5/36e5),m=Math.floor(d%36e5/6e4),s=Math.floor(d%6e4/1e3);
cd.textContent=D;cdsub.textContent=h+"h "+m+"m "+s+"s";}u();setInterval(u,1000);})();
</script>
<div class="layout">
<section class="slopcol"><h3>Sloppy AI</h3><div id="slop"></div></section>
<main id="posts" aria-live="polite"></main>
<aside class="sidebar">
<section class="countdown">
  <img class="bubble" src="bubble.jpg?v=1" alt="SlopStar popping the AI bubble with a needle">
  <div class="cdtail">Until the AI bubble pops</div>
  <div class="cdwrap"><span id="cd" class="cd">181</span><span class="cdunit">days</span></div>
  <div id="cdsub" class="cdsub"></div>
</section>
<section class="badnews"><h3>Bad News</h3><ul id="bad"><li class="none">No bad news yet. Enjoy it while it lasts.</li></ul></section>
</aside>
</div>
<footer>Hand-picked slop &middot; no warranty, express or hallucinated</footer>
<script src="app.js"></script>
</body>
</html>
